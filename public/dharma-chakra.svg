    <line x1="68" y1="32" x2="72" y2="36"/>
    <line x1="72" y1="32" x2="68" y2="36"/>
    <line x1="82" y1="58" x2="78" y2="62"/>
    <line x1="82" y1="62" x2="78" y2="58"/>
    <line x1="68" y1="88" x2="72" y2="84"/>
    <line x1="72" y1="88" x2="68" y2="84"/>
    <line x1="58" y1="82" x2="62" y2="78"/>
    <line x1="62" y1="82" x2="58" y2="78"/>
    <line x1="48" y1="88" x2="52" y2="84"/>
